name: Database Backup

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 2am UTC
  workflow_dispatch:       # Allow manual trigger from GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Needed to create GitHub Releases

    steps:
      - name: Set backup date
        run: echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Disable IPv6 (GitHub runners lack IPv6 connectivity)
        run: sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Create database dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Resolve hostname to IPv4 to avoid IPv6 issues on GitHub runners
          IPV4=$(dig +short A db.rbqlfwqhqbypheyxeluf.supabase.co | grep -E '^[0-9]+\.' | head -1)
          echo "Resolved to IPv4: $IPV4"

          PGHOSTADDR=$IPV4 PGSSLMODE=require pg_dump "$DATABASE_URL" \
            --clean --no-acl --no-owner \
            | gzip > backup-${{ env.DATE }}.sql.gz

          # Fail if backup is empty (less than 100 bytes)
          SIZE=$(wc -c < backup-${{ env.DATE }}.sql.gz)
          echo "Backup size: $SIZE bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "ERROR: Backup file is empty — pg_dump likely failed"
            exit 1
          fi

      - name: Upload backup to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup-${{ env.DATE }}
          name: "DB Backup ${{ env.DATE }}"
          body: "Automated weekly database backup."
          files: backup-${{ env.DATE }}.sql.gz
